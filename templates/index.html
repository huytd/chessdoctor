<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Doctor - Game Analysis</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/chessboard-1.0.0.css">
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }
        .chessboard {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        #board {
            width: 100%;
            margin-bottom: 15px;
        }
        .board-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 100%; /* Makes the container square */
            overflow: visible; /* Allow annotations to overflow if needed */
        }
        #arrow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .analysis-container {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            background-color: white;
        }
        .move-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .move-item:hover {
            background-color: #f1f1f1;
        }
        .move-item.active {
            background-color: #e9ecef;
            font-weight: bold;
        }
        .move-pair {
            display: flex;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .move-number {
            width: 40px;
            font-weight: bold;
        }
        .white-move, .black-move {
            flex: 1;
            cursor: pointer;
            padding: 0 5px;
        }
        .white-move:hover, .black-move:hover {
            background-color: #f1f1f1;
        }
        .white-move.active, .black-move.active {
            background-color: #e9ecef;
            font-weight: bold;
        }
        .blunder {
            color: #dc3545;
        }
        .mistake {
            color: #fd7e14;
        }
        .inaccuracy {
            color: #ffc107;
        }
        .good-move {
            color: #28a745;
        }
        .brilliant {
            color: #1ba5b8;
            font-weight: bold;
        }
        .great {
            color: #5c8bb0;
            font-weight: bold;
        }
        .book {
            color: #a88865;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        .game-info {
            margin-bottom: 20px;
            padding: 10px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .controls {
            margin: 15px 0;
        }
        .controls button {
            margin: 0 5px;
        }
        .explanation {
            font-style: italic;
            margin-top: 5px;
        }
        .move-explanation {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            min-height: 100px;
        }
        .move-quality-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .quality-blunder {
            background-color: #dc3545;
        }
        .quality-mistake {
            background-color: #fd7e14;
        }
        .quality-inaccuracy {
            background-color: #ffc107;
        }
        .quality-good {
            background-color: #28a745;
        }
        .quality-brilliant {
            background-color: #1ba5b8;
        }
        .quality-great {
            background-color: #5c8bb0;
        }
        .quality-book {
            background-color: #a88865;
        }
        /* Arrow styles */
        .arrow-current {
            stroke: rgba(0, 0, 255, 0.7);
            stroke-width: 8px;
        }
        .arrow-better {
            stroke: rgba(0, 128, 0, 0.7);
            stroke-width: 8px;
        }
        .arrow-threat {
            stroke: rgba(220, 53, 69, 0.85);
            stroke-width: 6px;
        }
        .arrow-opponent-threat {
            stroke: rgba(230, 57, 70, 0.85);
            stroke-width: 6px;
            stroke-dasharray: 6, 4;
        }
        .arrow-head-current {
            fill: rgba(0, 0, 255, 0.7);
        }
        .arrow-head-better {
            fill: rgba(0, 128, 0, 0.7);
        }
        .arrow-head-threat {
            fill: rgba(220, 53, 69, 0.85);
        }
        .arrow-head-opponent-threat {
            fill: rgba(230, 57, 70, 0.85);
        }
        /* Square annotation styles */
        .square-annotation {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            z-index: 9999;
            pointer-events: none;
            box-sizing: border-box;
            border: 2px solid #000;
        }
        .square-annotation::before {
            content: attr(data-symbol);
            position: absolute;
            top: 2px;
            right: 2px;
            transform: none;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            font-family: 'Arial', sans-serif;
            border-radius: 50%;
            width: 1.2rem;
            height: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
        }
        .square-annotation::after {
            content: none;
        }
        
        .annotation-blunder {
            background-color: transparent;
            border-color: rgba(220, 53, 69, 0.3);
        }
        .annotation-mistake {
            background-color: transparent;
            border-color: rgba(253, 126, 20, 0.3);
        }
        .annotation-inaccuracy {
            background-color: transparent;
            border-color: rgba(255, 193, 7, 0.3);
        }
        .annotation-blunder::before {
            background-color: rgba(220, 53, 69, 0.9);
        }
        .annotation-mistake::before {
            background-color: rgba(253, 126, 20, 0.9);
        }
        .annotation-inaccuracy::before {
            background-color: rgba(255, 193, 7, 0.9);
        }
        /* Principal variation styling */
        .principal-variation {
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 5px;
            border-radius: 3px;
            border-left: 3px solid #007bff;
            margin-top: 5px;
        }
        .clickable {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .clickable:hover {
            background-color: #e9ecef;
        }
        .play-button {
            margin-left: 10px;
            font-size: 0.8rem;
            padding: 2px 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Chess Doctor</h1>
        
        <div class="row">
            <div class="col-md-6">
                <!-- Chessboard -->
                <div class="chessboard">
                    <div class="board-container">
                        <div id="board"></div>
                        <svg id="arrow-svg"></svg>
                    </div>
                    
                    <!-- Controls -->
                    <div class="controls text-center">
                        <button id="btnFirst" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-skip-start-fill"></i> First
                        </button>
                        <button id="btnPrev" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-caret-left-fill"></i> Prev
                        </button>
                        <button id="btnNext" class="btn btn-sm btn-outline-secondary">
                            Next <i class="bi bi-caret-right-fill"></i>
                        </button>
                        <button id="btnLast" class="btn btn-sm btn-outline-secondary">
                            Last <i class="bi bi-skip-end-fill"></i>
                        </button>
                        <div class="form-check form-switch d-inline-block ms-3 align-middle">
                            <input class="form-check-input" type="checkbox" id="toggleThreats" checked>
                            <label class="form-check-label small fw-bold text-danger" for="toggleThreats">Threats</label>
                        </div>
                    </div>
                    
                    <!-- Game Info -->
                    <div class="game-info" id="gameInfo">
                        <p class="mb-0">Paste a PGN to analyze a game</p>
                    </div>
                </div>
                
                <!-- PGN Input -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
                        <label for="pgnInput" class="form-label mb-0">Paste PGN:</label>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-success-subtle text-success border border-success-subtle"><i class="bi bi-cpu"></i> In-Browser (WASM)</span>
                            <div class="d-flex align-items-center gap-1">
                                <label for="analysisDepth" class="small text-muted mb-0">Depth:</label>
                                <select id="analysisDepth" class="form-select form-select-sm py-0 px-2" style="width: auto; font-size: 0.82rem;" title="Higher depth provides deeper tactics and higher accuracy">
                                    <option value="10">Fast (10)</option>
                                    <option value="12" selected>Standard (12)</option>
                                    <option value="14">Deep (14)</option>
                                    <option value="16">Master (16)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <textarea class="form-control" id="pgnInput" rows="6" placeholder="Paste your PGN here..."></textarea>
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <button id="analyzeBtn" class="btn btn-primary">Analyze Game</button>
                    <button id="cancelAnalyzeBtn" class="btn btn-outline-danger d-none">
                        <i class="bi bi-x-circle"></i> Cancel
                    </button>
                </div>

                <!-- In-Browser Analysis Progress Bar -->
                <div id="analysisProgressContainer" class="mt-3 p-2 bg-light rounded border d-none">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span id="progressText" class="small fw-semibold text-primary">Initializing Stockfish WASM...</span>
                        <span id="progressPercent" class="badge bg-primary">0%</span>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <!-- Analysis Results -->
                <h3>Analysis</h3>
                <div class="analysis-container" id="analysisContainer">
                    <p class="text-center text-muted">Analysis will appear here after you analyze a game.</p>
                </div>


                <!-- Move Explanation -->
                <div class="move-explanation mt-3" id="moveExplanation">
                    <p class="text-muted">Select a move to see analysis</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="js/chessboard-1.0.0.js"></script>
    <script src="js/chess-evaluator.js"></script>
    <script src="js/opening-detector.js"></script>
    <script src="js/situation-recognizer.js"></script>
    <script src="js/browser-analyzer.js"></script>
    <script>
        $(document).ready(function() {
            // Initialize variables
            const board = Chessboard('board', {
                position: 'start',
                pieceTheme: 'img/chesspieces/wikipedia/{piece}.png'
            });
            const chess = new Chess();
            let analysisData = null;
            let currentMoveIndex = -1;
            let moves = [];
            let moveHistory = [];
            let isPlayingVariation = false;
            let animationSpeed = 1000; // milliseconds per move
            let animationTimeout = null;
            let browserDoctor = null;
            
            // DOM elements
            const pgnInput = document.getElementById('pgnInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const cancelAnalyzeBtn = document.getElementById('cancelAnalyzeBtn');
            const analysisContainer = document.getElementById('analysisContainer');
            const moveExplanation = document.getElementById('moveExplanation');
            const gameInfo = document.getElementById('gameInfo');
            const btnFirst = document.getElementById('btnFirst');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnLast = document.getElementById('btnLast');
            const arrowSvg = document.getElementById('arrow-svg');
            const boardContainer = document.querySelector('.board-container');
            
            // Ensure the SVG has the same dimensions as the board
            function updateSvgDimensions() {
                const boardEl = document.getElementById('board');
                if (boardEl) {
                    const boardRect = boardEl.getBoundingClientRect();
                    arrowSvg.setAttribute('width', boardRect.width);
                    arrowSvg.setAttribute('height', boardRect.width); // Square board
                }
            }
            
            // Call once on load
            setTimeout(updateSvgDimensions, 100);
            
            // Set up SVG definitions for arrow markers
            setupArrowMarkers();
            
            // Event listeners
            analyzeBtn.addEventListener('click', analyzeGame);
            if (cancelAnalyzeBtn) {
                cancelAnalyzeBtn.addEventListener('click', function() {
                    if (browserDoctor) {
                        browserDoctor.cancel();
                    }
                });
            }
            btnFirst.addEventListener('click', goToFirstMove);
            btnPrev.addEventListener('click', goToPrevMove);
            btnNext.addEventListener('click', goToNextMove);
            btnLast.addEventListener('click', goToLastMove);
            
            const toggleThreats = document.getElementById('toggleThreats');
            if (toggleThreats) {
                toggleThreats.addEventListener('change', function() {
                    if (currentMoveIndex >= 0) {
                        drawMoveArrows(currentMoveIndex);
                    }
                });
            }
            
            // Set up arrow markers
            function setupArrowMarkers() {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                
                // Current move marker
                const markerCurrent = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerCurrent.setAttribute('id', 'arrowhead-current');
                markerCurrent.setAttribute('markerWidth', '6');
                markerCurrent.setAttribute('markerHeight', '4');
                markerCurrent.setAttribute('refX', '4');
                markerCurrent.setAttribute('refY', '2');
                markerCurrent.setAttribute('orient', 'auto');
                
                const polygonCurrent = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygonCurrent.setAttribute('points', '0 0, 6 2, 0 4');
                polygonCurrent.setAttribute('class', 'arrow-head-current');
                
                markerCurrent.appendChild(polygonCurrent);
                defs.appendChild(markerCurrent);
                
                // Better move marker
                const markerBetter = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerBetter.setAttribute('id', 'arrowhead-better');
                markerBetter.setAttribute('markerWidth', '6');
                markerBetter.setAttribute('markerHeight', '4');
                markerBetter.setAttribute('refX', '4');
                markerBetter.setAttribute('refY', '2');
                markerBetter.setAttribute('orient', 'auto');
                
                const polygonBetter = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygonBetter.setAttribute('points', '0 0, 6 2, 0 4');
                polygonBetter.setAttribute('class', 'arrow-head-better');
                
                markerBetter.appendChild(polygonBetter);
                defs.appendChild(markerBetter);

                // Threat move marker
                const markerThreat = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerThreat.setAttribute('id', 'arrowhead-threat');
                markerThreat.setAttribute('markerWidth', '6');
                markerThreat.setAttribute('markerHeight', '4');
                markerThreat.setAttribute('refX', '4');
                markerThreat.setAttribute('refY', '2');
                markerThreat.setAttribute('orient', 'auto');
                
                const polygonThreat = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygonThreat.setAttribute('points', '0 0, 6 2, 0 4');
                polygonThreat.setAttribute('class', 'arrow-head-threat');
                
                markerThreat.appendChild(polygonThreat);
                defs.appendChild(markerThreat);

                // Opponent threat marker
                const markerOpponent = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                markerOpponent.setAttribute('id', 'arrowhead-opponent-threat');
                markerOpponent.setAttribute('markerWidth', '6');
                markerOpponent.setAttribute('markerHeight', '4');
                markerOpponent.setAttribute('refX', '4');
                markerOpponent.setAttribute('refY', '2');
                markerOpponent.setAttribute('orient', 'auto');
                
                const polygonOpponent = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygonOpponent.setAttribute('points', '0 0, 6 2, 0 4');
                polygonOpponent.setAttribute('class', 'arrow-head-opponent-threat');
                
                markerOpponent.appendChild(polygonOpponent);
                defs.appendChild(markerOpponent);
                
                arrowSvg.appendChild(defs);
            }
            
            // Handle completed game analysis data
            function handleAnalysisResult(data) {
                if (!data) return;
                
                // Store analysis data
                analysisData = data;
                
                // Display game info
                displayGameInfo(data.game_info || {});
                
                // Process moves
                moves = data.moves || [];
                
                if (moves.length === 0) {
                    analysisContainer.innerHTML = '<div class="alert alert-warning">No moves were analyzed. Please check your PGN format.</div>';
                    return;
                }

                // Pre-calculate move data for each position
                preprocessMoves();
                
                // Display analysis
                displayAnalysis(moves);
                
                // Go to first position
                goToFirstMove();
            }

            // Analyze game function (In-Browser WebAssembly)
            async function analyzeGame() {
                const pgn = pgnInput.value.trim();
                if (!pgn) {
                    alert('Please paste a PGN to analyze.');
                    return;
                }
                
                const analysisDepth = parseInt(document.getElementById('analysisDepth')?.value || '12', 10);

                // Reset the board and analysis
                chess.reset();
                board.position('start');
                clearArrows();
                clearSquareAnnotations();
                analysisContainer.innerHTML = '<p class="text-center text-muted">Analyzing...</p>';
                moveExplanation.innerHTML = '<p class="text-muted">Select a move to see analysis</p>';
                currentMoveIndex = -1;
                moveHistory = [];

                // In-Browser (WebAssembly) Engine
                const progressContainer = document.getElementById('analysisProgressContainer');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                const progressPercent = document.getElementById('progressPercent');
                const cancelBtn = document.getElementById('cancelAnalyzeBtn');

                if (progressContainer) progressContainer.classList.remove('d-none');
                if (cancelBtn) cancelBtn.classList.remove('d-none');
                analyzeBtn.disabled = true;
                if (progressBar) progressBar.style.width = '0%';
                if (progressPercent) progressPercent.textContent = '0%';
                if (progressText) progressText.textContent = `Initializing Stockfish WASM (Depth ${analysisDepth})...`;

                if (!browserDoctor) {
                    browserDoctor = new BrowserChessDoctor();
                }

                const onProgress = (prog) => {
                    if (progressBar) progressBar.style.width = `${prog.percentage}%`;
                    if (progressPercent) progressPercent.textContent = `${prog.percentage}%`;
                    if (progressText) {
                        progressText.textContent = `Analyzing move ${prog.ply} of ${prog.totalPlies} (${prog.move}) • Depth ${prog.depth || analysisDepth}...`;
                    }
                };

                try {
                    const data = await browserDoctor.analyzeGame(pgn, onProgress, analysisDepth);
                    if (data.errors && data.errors.length > 0 && (!data.moves || data.moves.length === 0)) {
                        throw new Error(data.errors.join(', '));
                    }
                    handleAnalysisResult(data);
                } catch (error) {
                    analysisContainer.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
                    console.error('Browser analysis error:', error);
                } finally {
                    if (progressContainer) progressContainer.classList.add('d-none');
                    if (cancelBtn) cancelBtn.classList.add('d-none');
                    analyzeBtn.disabled = false;
                }
            }
            
            // Preprocess moves to calculate from/to squares
            function preprocessMoves() {
                // Reset chess position
                chess.reset();
                moveHistory = [];
                
                // Process each move
                moves.forEach((move, index) => {
                    try {
                        // Save current position
                        const currentFen = chess.fen();
                        
                        // Make the move and capture from/to
                        const chessMove = chess.move(move.move);
                        
                        if (chessMove) {
                            // Store move data
                            moveHistory.push({
                                from: chessMove.from,
                                to: chessMove.to,
                                fen: currentFen
                            });
                            
                            // If there's a better move, calculate its from/to
                            if (move.quality !== 'good move' && move.analysis && move.analysis.best_move) {
                                // Load the position before this move
                                const tempChess = new Chess(currentFen);
                                
                                try {
                                    // Try different formats for the better move
                                    let betterMove = null;
                                    
                                    // First try standard algebraic notation (SAN)
                                    try {
                                        betterMove = tempChess.move(move.analysis.best_move);
                                    } catch (e) {
                                        console.log("Failed to parse better move as SAN, trying UCI format");
                                        
                                        // If that fails, try UCI format (e.g., "e2e4")
                                        if (move.analysis.best_move.length >= 4) {
                                            try {
                                                betterMove = tempChess.move({
                                                    from: move.analysis.best_move.substring(0, 2),
                                                    to: move.analysis.best_move.substring(2, 4),
                                                    promotion: move.analysis.best_move.length > 4 ? 
                                                        move.analysis.best_move[4] : undefined
                                                });
                                            } catch (e2) {
                                                console.error("UCI format also failed:", e2);
                                            }
                                        }
                                    }
                                    
                                    // If that didn't work, try to extract move from principal variation
                                    if (!betterMove && move.analysis.principal_variation) {
                                        console.log("Trying to extract better move from principal variation");
                                        
                                        // Look for a pattern like "33...Rxd2" or just "Rxd2"
                                        const pvMoves = parsePrincipalVariation(move.analysis.principal_variation, currentFen);
                                        if (pvMoves.length > 0) {
                                            betterMove = {
                                                from: pvMoves[0].from,
                                                to: pvMoves[0].to,
                                                san: pvMoves[0].san,
                                                promotion: pvMoves[0].promotion
                                            };
                                            console.log("Extracted first move from PV:", betterMove);
                                        }
                                    }
                                    
                                    if (betterMove) {
                                        // Store better move data
                                        moves[index].betterMoveData = {
                                            from: betterMove.from,
                                            to: betterMove.to,
                                            san: betterMove.san,
                                            promotion: betterMove.promotion
                                        };
                                        console.log("Stored better move data for move", index, ":", moves[index].betterMoveData);
                                    } else {
                                        console.error("Could not parse better move:", move.analysis.best_move);
                                    }
                                } catch (e) {
                                    console.error('Error parsing better move:', move.analysis.best_move, e);
                                }
                            }
                        }
                    } catch (e) {
                        console.error('Error preprocessing move:', move.move, e);
                    }
                });
                
                // Reset chess position
                chess.reset();
            }
            
            // Display game info
            function displayGameInfo(info) {
                if (!info) return;
                
                gameInfo.innerHTML = `
                    <strong>${info.white || 'Unknown'} vs ${info.black || 'Unknown'}</strong><br>
                    ${info.event ? `Event: ${info.event}<br>` : ''}
                    ${info.date ? `Date: ${info.date}` : ''}
                `;
            }
            
            // Display analysis
            function displayAnalysis(moves) {
                if (!moves || moves.length === 0) {
                    analysisContainer.innerHTML = '<p class="text-center text-muted">No moves to analyze.</p>';
                    return;
                }
                
                // Group moves by move number
                const movesByNumber = {};
                moves.forEach(move => {
                    if (!movesByNumber[move.move_number]) {
                        movesByNumber[move.move_number] = { white: null, black: null };
                    }
                    
                    if (move.is_white) {
                        movesByNumber[move.move_number].white = move;
                    } else {
                        movesByNumber[move.move_number].black = move;
                    }
                });
                
                let html = '<div class="move-list">';
                
                // Create move pairs
                Object.keys(movesByNumber).sort((a, b) => parseInt(a) - parseInt(b)).forEach(moveNumber => {

            // Draw an arrow on the board
            function drawArrow(from, to, type) {
                // Get board dimensions
                const boardEl = document.getElementById('board');
                const boardRect = boardEl.getBoundingClientRect();
                const squareSize = boardRect.width / 8;
                
                // Calculate center points of squares
                const fromFile = from.charCodeAt(0) - 'a'.charCodeAt(0);
                const fromRank = 8 - parseInt(from.charAt(1));
                const toFile = to.charCodeAt(0) - 'a'.charCodeAt(0);
                const toRank = 8 - parseInt(to.charAt(1));
                
                const fromX = (fromFile + 0.5) * squareSize;
                const fromY = (fromRank + 0.5) * squareSize;
                const toX = (toFile + 0.5) * squareSize;
                const toY = (toRank + 0.5) * squareSize;
                
                // Calculate the angle for the arrowhead
                const angle = Math.atan2(toY - fromY, toX - fromX);
                
                // Adjust end point to not overlap with the piece
                const shortenBy = squareSize * 0.25;
                const adjustedToX = toX - shortenBy * Math.cos(angle);
                const adjustedToY = toY - shortenBy * Math.sin(angle);
                
                // Create arrow line
                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                arrow.setAttribute('x1', fromX);
                arrow.setAttribute('y1', fromY);
                arrow.setAttribute('x2', adjustedToX);
                arrow.setAttribute('y2', adjustedToY);
                arrow.setAttribute('class', `arrow-${type}`);
                arrow.setAttribute('marker-end', `url(#arrowhead-${type})`);
                
                arrowSvg.appendChild(arrow);
                
                console.log(`Drew arrow from ${from} to ${to} (${fromX},${fromY} to ${adjustedToX},${adjustedToY})`);
            }

            function goToMove(index) {

            // Parse principal variation string into a sequence of moves
            function parsePrincipalVariation(pvString, startingFen) {
                console.log("Parsing PV string:", pvString);
                console.log("Starting FEN:", startingFen);
                
                if (!pvString) {
                    console.error("Empty PV string");
                    return [];
                }
                
                // Create a new chess instance with the starting position
                const tempChess = new Chess(startingFen);
                console.log("Chess position set to:", tempChess.fen());
                
                // Clean the PV string - remove any extra formatting that might cause issues
                let cleanPV = pvString.replace(/\s+/g, ' ').trim();
                
                // Handle common formats of principal variation strings
                // If the PV starts with a move number and ellipsis (like "33...Rxd2"), 
                // this indicates a black move alternative
                const blackMoveRegex = /^(\d+)\.\.\.(.+?)(?=\s+\d+\.|$)/;
                const blackMoveMatch = cleanPV.match(blackMoveRegex);
                
                if (blackMoveMatch) {
                    // For clarity, extract the first black move
                    const moveNumber = blackMoveMatch[1];
                    const firstBlackMove = blackMoveMatch[2].trim();
                    console.log(`Detected black move format: Move ${moveNumber}, first black move: ${firstBlackMove}`);
                }
                
                // Split the PV string into tokens
                const tokens = cleanPV.split(' ');
                console.log("Tokens:", tokens);
                
                const moves = [];
                
                // Store all the tokens that could be moves (without move numbers)
                const potentialMoves = [];
                
                // First pass: extract all potential moves, removing move numbers
                for (let i = 0; i < tokens.length; i++) {
                    let token = tokens[i];
                    
                    // Handle move numbers with ellipsis (e.g., "33..." for black moves)
                    if (token.includes('...')) {
                        const parts = token.split('...');
                        if (parts.length > 1 && parts[1]) {
                            token = parts[1].trim(); // Extract the move part
                            potentialMoves.push(token);
                        }
                    }
                    // Handle move numbers (e.g., "1.", "2.", etc.)
                    else if (token.includes('.')) {
                        // Check if it's a move number with a move (e.g., "1.e4")
                        const parts = token.split('.');
                        if (parts.length > 1 && parts[1]) {
                            token = parts[1].trim(); // Extract the move part
                            potentialMoves.push(token);
                        }
                        // Skip pure move numbers
                    } else {
                        // It's probably a move
                        potentialMoves.push(token);
                    }
                }
                
                console.log("Potential moves extracted:", potentialMoves);
                
                // Second pass: try to make each potential move
                for (let i = 0; i < potentialMoves.length; i++) {
                    const moveText = potentialMoves[i];
                    console.log("Attempting to make move:", moveText);
                    
                    // Try multiple formats to parse the move
                    let move = null;
                    
                    // Try as SAN (Standard Algebraic Notation - e.g., "e4", "Nf3")
                    try {
                        move = tempChess.move(moveText);
                    } catch (e) {
                        console.log("SAN move failed:", e.message);
                    }
                    
                    // If SAN failed, try as UCI format (e.g., "e2e4")
                    if (!move && moveText.length >= 4) {
                        try {
                            move = tempChess.move({
                                from: moveText.substring(0, 2),
                                to: moveText.substring(2, 4),
                                promotion: moveText.length > 4 ? moveText[4] : undefined
                            });
                        } catch (e) {
                            console.log("UCI move failed:", e.message);
                        }
                    }
                    
                    // If move was successfully made, add to the list
                    if (move) {
                        console.log("Move successful:", move);
                        moves.push({
                            from: move.from,
                            to: move.to,
                            promotion: move.promotion,
                            san: move.san,
                            fen: tempChess.fen()
                        });
                    } else {
                        console.error("Failed to parse move:", moveText);
                        // Don't break the loop, try to parse the next move
                    }
                }
                
                console.log("Successfully parsed moves:", moves.length);
                return moves;
            }
            
            // Find king square for a given color ('w' or 'b')
            function findKingSquare(chessInstance, color) {
                for (const f of ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h']) {
                    for (let r = 1; r <= 8; r++) {
                        const sq = f + r;
                        const p = chessInstance.get(sq);
                        if (p && p.type === 'k' && p.color === color) {
                            return sq;
                        }
                    }
                }
                return null;
            }

            // Helper to detect threats created by a move on the board
            function getMoveThreats(boardAfter, moveData) {
                let threats = [];
                if (typeof SituationRecognizer !== 'undefined' && boardAfter && moveData) {
                    threats = SituationRecognizer.detectThreatsCreated(boardAfter, moveData) || [];

                    // Discovered check or general check detection
                    if (boardAfter.in_check && boardAfter.in_check()) {
                        if (!threats.some(t => t.is_check)) {
                            const oppKingSq = findKingSquare(boardAfter, boardAfter.turn());
                            if (oppKingSq) {
                                const moverColor = (boardAfter.turn() === 'w') ? 'b' : 'w';
                                const checkers = SituationRecognizer.getAttackers(boardAfter, moverColor, oppKingSq);
                                checkers.forEach(sq => {
                                    threats.push({
                                        from: sq,
                                        to: oppKingSq,
                                        target: 'king',
                                        is_check: true,
                                        is_undefended: true,
                                        description: 'checks the enemy King'
                                    });
                                });
                            }
                        }
                    }
                }
                return threats;
            }

            // Play through a variation with animation
            function playVariation(moveIndex, lineType = 'better') {
                console.log("Starting variation playback for move index:", moveIndex, "lineType:", lineType);
                
                // Stop any ongoing animation
                stopVariationPlayback();
                
                // Get the move and its analysis
                const move = moves[moveIndex];
                if (!move || !move.analysis) {
                    console.error("No valid move or analysis found for index:", moveIndex);
                    return;
                }
                
                // Get the selected animation speed
                const speedControl = document.getElementById('speedControl');
                if (speedControl) {
                    animationSpeed = parseInt(speedControl.value);
                }
                console.log("Animation speed:", animationSpeed);
                
                const isRefutation = (lineType === 'refutation');
                
                // Determine starting position:
                // Refutation line starts AFTER the played move;
                // Better alternative line starts BEFORE the played move.
                let startingFen = 'start';
                if (isRefutation) {
                    if (moveIndex + 1 < moveHistory.length && moveHistory[moveIndex + 1]) {
                        startingFen = moveHistory[moveIndex + 1].fen;
                    } else {
                        const tempChess = new Chess();
                        for (let i = 0; i <= moveIndex; i++) {
                            try {
                                tempChess.move(moves[i].move);
                            } catch (e) {
                                console.error('Error reconstructing position:', e);
                            }
                        }
                        startingFen = tempChess.fen();
                    }
                } else {
                    if (moveIndex < moveHistory.length && moveHistory[moveIndex]) {
                        startingFen = moveHistory[moveIndex].fen;
                    } else if (moveIndex > 0) {
                        const tempChess = new Chess();
                        for (let i = 0; i < moveIndex; i++) {
                            try {
                                tempChess.move(moves[i].move);
                            } catch (e) {
                                console.error('Error reconstructing position:', e);
                            }
                        }
                        startingFen = tempChess.fen();
                    }
                }
                console.log("Starting FEN:", startingFen);
                
                const rawVariation = isRefutation ? move.analysis.refutation_variation : move.analysis.principal_variation;
                const arrowStyle = isRefutation ? 'opponent-threat' : 'better';

                // Check if variation is available
                if (!rawVariation) {
                    if (isRefutation) {
                        if (move.analysis.refutation_from && move.analysis.refutation_to) {
                            // Single refutation move fallback
                        } else {
                            alert("Sorry, no punishment line available for this position.");
                            return;
                        }
                    } else {
                        if (move.analysis.best_move && move.betterMoveData) {
                            showBetterMoveOnly(moveIndex, move.betterMoveData);
                        } else {
                            alert("Sorry, no alternative moves available for this position.");
                        }
                        return;
                    }
                }
                
                // Parse the variation moves
                let variationMoves = rawVariation ? parsePrincipalVariation(rawVariation, startingFen) : [];
                if (variationMoves.length === 0 && isRefutation && move.analysis.refutation_from && move.analysis.refutation_to) {
                    variationMoves = [{
                        from: move.analysis.refutation_from,
                        to: move.analysis.refutation_to,
                        san: move.analysis.refutation || ''
                    }];
                }

                if (variationMoves.length === 0) {
                    if (!isRefutation && move.analysis.best_move && move.betterMoveData) {
                        showBetterMoveOnly(moveIndex, move.betterMoveData);
                        return;
                    }
                    alert("Sorry, couldn't play the variation. The move format isn't recognized.");
                    return;
                }
                
                // Set flag to indicate we're playing a variation
                isPlayingVariation = true;
                
                // Reset the board to the starting position
                chess.load(startingFen);
                board.position(startingFen);
                
                // Add a Return to Game button to the move explanation
                const stopButton = document.createElement('button');
                stopButton.className = 'btn btn-sm btn-outline-danger mt-2';
                stopButton.innerHTML = '<i class="bi bi-arrow-return-left me-1"></i> Return to Game';
                stopButton.id = 'stopVariationBtn';
                stopButton.addEventListener('click', returnToGamePosition);
                moveExplanation.appendChild(stopButton);
                
                // Add a visual indicator
                const variationIndicator = document.createElement('div');
                variationIndicator.className = isRefutation ? 'alert alert-danger mt-2' : 'alert alert-info mt-2';
                variationIndicator.id = 'variationIndicator';
                variationIndicator.innerHTML = isRefutation
                    ? `<strong>Playing punishment line</strong> - Showing how the opponent can punish this mistake`
                    : `<strong>Playing expected line</strong> - Showing what could have happened with the better move`;
                moveExplanation.appendChild(variationIndicator);
                
                // Add a move counter indicator
                const moveCounter = document.createElement('div');
                moveCounter.id = 'moveIndicator';
                moveCounter.className = isRefutation ? 'badge bg-danger mt-2' : 'badge bg-primary mt-2';
                moveCounter.textContent = `Move 0 of ${variationMoves.length}`;
                moveExplanation.appendChild(moveCounter);

                // Add threat banner
                const threatBanner = document.createElement('div');
                threatBanner.id = 'variationThreatBanner';
                threatBanner.className = 'mt-2 text-danger small';
                moveExplanation.appendChild(threatBanner);
                
                // Highlight the active variation element
                const pvElement = isRefutation
                    ? document.querySelector('.principal-variation.refutation-line.clickable')
                    : document.querySelector('.principal-variation.clickable:not(.refutation-line)');
                if (pvElement) {
                    pvElement.style.backgroundColor = isRefutation ? '#ffe2e2' : '#e2f0ff';
                }
                
                // Animation logic
                let currentVarMoveIndex = 0;
                
                clearArrows();
                clearSquareAnnotations();
                if (variationMoves.length > 0) {
                    const firstMove = variationMoves[0];
                    drawArrow(firstMove.from, firstMove.to, arrowStyle);
                }
                
                function playNextMove() {
                    if (!isPlayingVariation) return;
                    
                    if (currentVarMoveIndex < variationMoves.length) {
                        const moveData = variationMoves[currentVarMoveIndex];
                        let executedMove = null;
                        try {
                            executedMove = chess.move({
                                from: moveData.from,
                                to: moveData.to,
                                promotion: moveData.promotion || 'q'
                            });
                            
                            board.position(chess.fen(), true);
                            
                            clearArrows();
                            clearSquareAnnotations();

                            // 1. Detect and draw threats created by the move just played
                            const moveThreats = getMoveThreats(chess, moveData);
                            const showThreats = document.getElementById('toggleThreats') ? document.getElementById('toggleThreats').checked : true;
                            if (showThreats && moveThreats.length > 0) {
                                moveThreats.slice(0, 3).forEach(threat => {
                                    drawArrow(threat.from, threat.to, 'threat');
                                });
                            }

                            // 2. Draw arrow for the NEXT move in the variation (if available)
                            if (currentVarMoveIndex + 1 < variationMoves.length) {
                                const nextMove = variationMoves[currentVarMoveIndex + 1];
                                drawArrow(nextMove.from, nextMove.to, arrowStyle);
                            }

                            // 3. Update move counter & threat banner
                            const indicator = document.getElementById('moveIndicator');
                            if (indicator) {
                                const moveNotation = executedMove ? executedMove.san : (moveData.san || '');
                                indicator.innerHTML = `Move ${currentVarMoveIndex + 1} of ${variationMoves.length}: <strong>${moveNotation}</strong>`;
                            }

                            const tb = document.getElementById('variationThreatBanner');
                            if (tb) {
                                let threatHtml = '';
                                if (chess.in_checkmate && chess.in_checkmate()) {
                                    threatHtml = `<div class="badge bg-danger p-2 fs-6"><i class="bi bi-trophy-fill me-1"></i> Checkmate delivered!</div>`;
                                } else if (chess.in_check && chess.in_check()) {
                                    threatHtml = `<span class="badge bg-danger p-1"><i class="bi bi-exclamation-triangle-fill me-1"></i> Check!</span> <span class="ms-1">Enemy King is under attack.</span>`;
                                } else if (moveThreats.length > 0) {
                                    const threatDescs = moveThreats.map(t => `<span class="badge bg-danger text-white border me-1">${t.description}</span>`).join(' ');
                                    threatHtml = `<div><strong><i class="bi bi-bullseye"></i> Threat created:</strong> ${threatDescs}</div>`;
                                }
                                tb.innerHTML = threatHtml;
                            }
                            
                            currentVarMoveIndex++;
                            if (currentVarMoveIndex < variationMoves.length) {
                                animationTimeout = setTimeout(playNextMove, animationSpeed);
                            } else {
                                // Line complete: Keep position and threats on board. DO NOT AUTOSWITCH!
                                onVariationComplete(move, isRefutation);
                            }
                        } catch (e) {
                            console.error("Failed to make move:", e);
                            alert("Error playing variation: " + e.message);
                            stopVariationPlayback();
                        }
                    }
                }
                
                setTimeout(() => {
                    if (isPlayingVariation) {
                        playNextMove();
                    }
                }, 700);
            }
            
            // Fallback function to show just the better move when principal variation fails
            function showBetterMoveOnly(moveIndex, betterMoveData) {
                // Stop any ongoing animation
                stopVariationPlayback();
                
                // Get the move and its analysis
                const move = moves[moveIndex];
                if (!move) return;
                
                // Get the position before this move was played
                let startingFen = 'start';
                if (moveIndex < moveHistory.length && moveHistory[moveIndex]) {
                    startingFen = moveHistory[moveIndex].fen;
                } else if (moveIndex > 0) {
                    const tempChess = new Chess();
                    for (let i = 0; i < moveIndex; i++) {
                        try {
                            tempChess.move(moves[i].move);
                        } catch (e) {
                            console.error('Error reconstructing position:', e);
                        }
                    }
                    startingFen = tempChess.fen();
                }
                
                // Set flag to indicate we're playing a variation
                isPlayingVariation = true;
                
                // Reset the board to the starting position
                chess.load(startingFen);
                board.position(startingFen);
                
                // Add a Return to Game button
                const stopButton = document.createElement('button');
                stopButton.className = 'btn btn-sm btn-outline-danger mt-2';
                stopButton.innerHTML = '<i class="bi bi-arrow-return-left me-1"></i> Return to Game';
                stopButton.id = 'stopVariationBtn';
                stopButton.addEventListener('click', returnToGamePosition);
                moveExplanation.appendChild(stopButton);

                // Add visual indicator
                const variationIndicator = document.createElement('div');
                variationIndicator.className = 'alert alert-info mt-2';
                variationIndicator.id = 'variationIndicator';
                variationIndicator.innerHTML = `<strong>Playing better move</strong>: ${betterMoveData.san || move.analysis.best_move}`;
                moveExplanation.appendChild(variationIndicator);

                const threatBanner = document.createElement('div');
                threatBanner.id = 'variationThreatBanner';
                threatBanner.className = 'mt-2 text-danger small';
                moveExplanation.appendChild(threatBanner);
                
                // Show the arrow for the better move initially
                clearArrows();
                clearSquareAnnotations();
                drawArrow(betterMoveData.from, betterMoveData.to, 'better');
                
                // Execute move after a brief delay
                animationTimeout = setTimeout(() => {
                    if (!isPlayingVariation) return;
                    try {
                        chess.move({
                            from: betterMoveData.from,
                            to: betterMoveData.to,
                            promotion: betterMoveData.promotion || 'q'
                        });
                        board.position(chess.fen(), true);
                        clearArrows();
                        clearSquareAnnotations();

                        const moveThreats = getMoveThreats(chess, betterMoveData);
                        const showThreats = document.getElementById('toggleThreats') ? document.getElementById('toggleThreats').checked : true;
                        if (showThreats && moveThreats.length > 0) {
                            moveThreats.slice(0, 3).forEach(threat => {
                                drawArrow(threat.from, threat.to, 'threat');
                            });
                        }

                        if (threatBanner) {
                            let threatHtml = '';
                            if (chess.in_checkmate && chess.in_checkmate()) {
                                threatHtml = `<div class="badge bg-danger p-2 fs-6"><i class="bi bi-trophy-fill me-1"></i> Checkmate delivered!</div>`;
                            } else if (chess.in_check && chess.in_check()) {
                                threatHtml = `<span class="badge bg-danger p-1"><i class="bi bi-exclamation-triangle-fill me-1"></i> Check!</span> <span class="ms-1">Enemy King is under attack.</span>`;
                            } else if (moveThreats.length > 0) {
                                const threatDescs = moveThreats.map(t => `<span class="badge bg-danger text-white border me-1">${t.description}</span>`).join(' ');
                                threatHtml = `<div><strong><i class="bi bi-bullseye"></i> Threat created:</strong> ${threatDescs}</div>`;
                            }
                            threatBanner.innerHTML = threatHtml;
                        }

                        // Line complete: Keep position and threats on board. DO NOT AUTOSWITCH!
                        onVariationComplete(move, false);
                    } catch (e) {
                        console.error("Error executing better move:", e);
                    }
                }, 700);
            }
            
            // Called when a variation finishes playing - DO NOT AUTOSWITCH!
            function onVariationComplete(move, isRefutation) {
                isPlayingVariation = false;
                
                const variationIndicator = document.getElementById('variationIndicator');
                if (variationIndicator) {
                    variationIndicator.className = isRefutation ? 'alert alert-danger mt-2' : 'alert alert-success mt-2';
                    variationIndicator.innerHTML = isRefutation
                        ? `<strong><i class="bi bi-check2-circle"></i> Punishment line complete.</strong> Notice the threats created on the board.`
                        : `<strong><i class="bi bi-check2-circle"></i> Better line complete.</strong> Notice the position and threats achieved.`;
                }
                
                const stopButton = document.getElementById('stopVariationBtn');
                if (stopButton) {
                    stopButton.className = 'btn btn-primary btn-sm mt-2 w-100 shadow-sm py-2';
                    const moveLabel = move ? (move.notation || move.move || '') : '';
                    stopButton.innerHTML = `<i class="bi bi-arrow-return-left me-1"></i> Return to Game (${moveLabel})`;
                    stopButton.onclick = returnToGamePosition;
                }
            }

            // Stop the variation playback and cleanup temporary UI
            function stopVariationPlayback() {
                isPlayingVariation = false;
                if (animationTimeout) {
                    clearTimeout(animationTimeout);
                    animationTimeout = null;
                }
                
                // Remove the stop / return button
                const stopButton = document.getElementById('stopVariationBtn');
                if (stopButton) {
                    stopButton.remove();
                }
                
                // Remove the variation indicator
                const variationIndicator = document.getElementById('variationIndicator');
                if (variationIndicator) {
                    variationIndicator.remove();
                }
                
                // Remove the move indicator
                const moveIndicator = document.getElementById('moveIndicator');
                if (moveIndicator) {
                    moveIndicator.remove();
                }

                // Remove threat banner
                const threatBanner = document.getElementById('variationThreatBanner');
                if (threatBanner) {
                    threatBanner.remove();
                }
                
                // Clear any arrows on the board
                clearArrows();
                clearSquareAnnotations();
                
                // Reset highlighting on variation elements
                const pvElements = document.querySelectorAll('.principal-variation.clickable');
                pvElements.forEach(pv => {
                    pv.style.backgroundColor = '';
                });
            }
            
            // Return to the original game position when the user chooses to
            function returnToGamePosition() {
                stopVariationPlayback();
                if (currentMoveIndex >= 0) {
                    goToMove(currentMoveIndex);
                } else {
                    goToFirstMove();
                }
            }
        });
    </script>
</body>
</html>
