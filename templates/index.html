<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chess Doctor - Studio Game Analysis</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/chessboard-1.0.0.css">
    
    <style>
        :root {
            --bg-base: #101216;
            --bg-surface: #171a21;
            --bg-surface-elevated: #1e222b;
            --bg-surface-hover: #262b37;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-medium: rgba(255, 255, 255, 0.12);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #38bdf8;
            --accent-dim: rgba(56, 189, 248, 0.15);
            
            /* Move quality colors */
            --q-blunder: #ef4444;
            --q-mistake: #f97316;
            --q-inaccuracy: #eab308;
            --q-good: #22c55e;
            --q-brilliant: #38bdf8;
            --q-great: #818cf8;
            --q-book: #d97706;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Slim Studio Header (48px) */
        .studio-header {
            height: 48px;
            background: #13161c;
            border-bottom: 1px solid var(--border-subtle);
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
        }

        .brand-icon {
            color: #38bdf8;
            font-size: 1.1rem;
        }

        .wasm-pill {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.25);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .chip-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            white-space: nowrap;
        }

        .chip-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }

        .btn-pgn-toggle {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-medium);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-pgn-toggle:hover {
            background: var(--bg-surface-hover);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-pgn-toggle.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Collapsible PGN Drawer */
        .pgn-drawer {
            max-height: 0;
            overflow: hidden;
            background: #14171e;
            border-bottom: 1px solid transparent;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
        }

        .pgn-drawer.open {
            max-height: 380px;
            border-bottom-color: var(--border-subtle);
        }

        .pgn-drawer-inner {
            padding: 12px 1rem 14px 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .pgn-textarea {
            background-color: #0d0f13;
            border: 1px solid var(--border-subtle);
            color: #f1f5f9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            line-height: 1.4;
            border-radius: 6px;
            resize: vertical;
        }
        .pgn-textarea:focus {
            background-color: #0d0f13;
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-dim);
        }

        @media (max-width: 768px) {
            .pgn-textarea {
                font-size: 16px; /* Avoid iOS auto-zoom */
            }
        }

        /* Studio Main Layout */
        .studio-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 1rem 1.5rem 1rem;
        }

        .studio-grid {
            display: grid;
            grid-template-columns: minmax(320px, 460px) 1fr;
            gap: 1rem;
            align-items: start;
        }

        /* Left Column: Board Studio */
        .board-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .game-info-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            padding: 4px 6px;
            color: var(--text-secondary);
        }

        .game-info-players {
            font-weight: 600;
            color: var(--text-primary);
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            background: #15181f;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .board-container {
            position: relative;
            width: 100%;
        }

        #board {
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .board-b72b1 {
            border: none !important;
        }

        #arrow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Arrow SVG Styles */
        .arrow-current { stroke: rgba(56, 189, 248, 0.9); stroke-width: 6.5px; }
        .arrow-better { stroke: rgba(52, 211, 153, 0.9); stroke-width: 6.5px; }
        .arrow-threat { stroke: rgba(248, 113, 113, 0.92); stroke-width: 5.5px; }
        .arrow-opponent-threat { stroke: rgba(251, 113, 133, 0.92); stroke-width: 5.5px; stroke-dasharray: 5, 3.5; }

        .arrow-head-current { fill: rgba(56, 189, 248, 0.9); }
        .arrow-head-better { fill: rgba(52, 211, 153, 0.9); }
        .arrow-head-threat { fill: rgba(248, 113, 113, 0.92); }
        .arrow-head-opponent-threat { fill: rgba(251, 113, 133, 0.92); }

        /* Square Annotations */
        .square-annotation {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            z-index: 9999;
            pointer-events: none;
            box-sizing: border-box;
        }
        .square-annotation::before {
            content: attr(data-symbol);
            position: absolute;
            top: 3px;
            right: 3px;
            color: white;
            font-weight: 800;
            font-size: 0.8rem;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            border-radius: 50%;
            width: 1.3rem;
            height: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .annotation-blunder::before { background-color: var(--q-blunder); }
        .annotation-mistake::before { background-color: var(--q-mistake); }
        .annotation-inaccuracy::before { background-color: var(--q-inaccuracy); color: #111; }

        /* Board Toolbar (Docked) */
        .board-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 4px 6px;
            gap: 6px;
        }

        .btn-tool {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: 4px;
            min-height: 36px;
            min-width: 36px;
            padding: 4px 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-tool:hover {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
        }
        .btn-tool:active {
            background: var(--bg-surface-hover);
        }

        .nav-cluster {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .threat-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #f87171;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            user-select: none;
        }
        .threat-pill input {
            cursor: pointer;
            accent-color: #ef4444;
        }

        /* Right Column: Unified Analysis Studio */
        .studio-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Move Diagnosis Banner */
        .diagnosis-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 12px 14px;
            min-height: 80px;
            transition: all 0.2s;
        }

        .diagnosis-empty {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.86rem;
            padding: 14px 0;
            justify-content: center;
        }

        .diagnosis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .move-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .player-badge.white {
            background: #e2e8f0;
            color: #0f172a;
        }
        .player-badge.black {
            background: #272c38;
            color: #f1f5f9;
            border: 1px solid var(--border-subtle);
        }

        .move-san {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .badge-q {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.03em;
        }
        .badge-q.blunder { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-q.mistake { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .badge-q.inaccuracy { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .badge-q.good-move { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-q.brilliant { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-q.great { background: rgba(129, 140, 248, 0.2); color: #a5b4fc; }
        .badge-q.book { background: rgba(217, 119, 6, 0.2); color: #fbbf24; }

        .eval-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            background: #111317;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
        }

        .diagnosis-text {
            font-size: 0.88rem;
            line-height: 1.45;
            color: #d1d5db;
            margin-bottom: 8px;
        }

        .tags-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .diag-tag {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .threat-alert-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #f87171;
            margin-bottom: 6px;
        }

        /* Variation interactive pills */
        .var-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        .var-pill {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 6px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .var-pill:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-medium);
        }

        .var-refutation {
            border-left: 3px solid var(--q-blunder);
            color: #fca5a5;
        }
        .var-better {
            border-left: 3px solid var(--q-good);
            color: #86efac;
        }

        .btn-var-play {
            background: var(--bg-surface-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            font-size: 0.74rem;
            font-weight: 600;
            padding: 2px 8px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn-var-play:hover {
            background: var(--accent);
            color: #000;
        }

        /* Move Notation Sheet */
        .sheet-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .sheet-header {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.015);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .sheet-title {
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.76rem;
        }

        .analysis-container {
            max-height: 380px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .analysis-container::-webkit-scrollbar {
            width: 5px;
        }
        .analysis-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .analysis-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
        }

        .move-pair {
            display: grid;
            grid-template-columns: 42px 1fr 1fr;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.86rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.025);
            padding: 1px 4px;
        }

        .move-number {
            color: var(--text-muted);
            font-size: 0.78rem;
            padding-left: 6px;
        }

        .white-move, .black-move {
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d1d5db;
            transition: all 0.12s;
        }

        .white-move:hover, .black-move:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .white-move.active, .black-move.active {
            background: var(--accent-dim);
            color: var(--accent);
            font-weight: 700;
        }

        .dot-q {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dot-blunder { background-color: var(--q-blunder); }
        .dot-mistake { background-color: var(--q-mistake); }
        .dot-inaccuracy { background-color: var(--q-inaccuracy); }
        .dot-good { background-color: var(--q-good); }
        .dot-brilliant { background-color: var(--q-brilliant); }
        .dot-great { background-color: var(--q-great); }
        .dot-book { background-color: var(--q-book); }

        /* Inline Progress Strip */
        .progress-strip {
            background: #15181f;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 8px;
            display: none;
        }
        .progress-strip.show {
            display: block;
        }

        /* Mobile specific styling */
        @media (max-width: 991px) {
            .studio-grid {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .board-toolbar .btn-tool {
                min-height: 42px;
                min-width: 42px;
            }
            .white-move, .black-move {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Slim Header -->
    <header class="studio-header">
        <div class="d-flex align-items-center gap-3">
            <a href="#" class="brand-link">
                <i class="bi bi-heart-pulse-fill brand-icon"></i>
                <span>Chess Doctor</span>
                <span class="wasm-pill">WASM</span>
            </a>
            <div class="d-none d-md-flex align-items-center gap-1 ms-2">
                <span class="text-muted small me-1">Sample:</span>
                <button type="button" class="chip-btn" data-sample="opera">Morphy's Opera</button>
                <button type="button" class="chip-btn" data-sample="kasparov">Kasparov Immortal</button>
                <button type="button" class="chip-btn" data-sample="scholar">Scholar's Mate</button>
            </div>
        </div>
        <div class="d-flex align-items-center gap-2">
            <div class="d-none d-lg-flex align-items-center text-muted small me-2">
                <span class="me-1">Keys:</span>
                <kbd style="background:#1e222b;color:#9ca3af;font-size:0.7rem;padding:1px 4px;border-radius:3px;">←</kbd>
                <kbd style="background:#1e222b;color:#9ca3af;font-size:0.7rem;padding:1px 4px;border-radius:3px;" class="ms-1">→</kbd>
                <kbd style="background:#1e222b;color:#9ca3af;font-size:0.7rem;padding:1px 4px;border-radius:3px;" class="ms-1">F</kbd>
            </div>
            <button type="button" id="btnTogglePgn" class="btn-pgn-toggle">
                <i class="bi bi-file-earmark-text"></i>
                <span>Load PGN</span>
                <i id="pgnCaret" class="bi bi-chevron-down" style="font-size: 0.75rem;"></i>
            </button>
        </div>
    </header>

    <!-- Collapsible PGN Drawer -->
    <div id="pgnDrawer" class="pgn-drawer">
        <div class="pgn-drawer-inner">
            <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <span class="small fw-semibold text-light">Paste PGN Notation</span>
                    <div class="d-flex d-md-none gap-1">
                        <button type="button" class="chip-btn" data-sample="opera">Opera</button>
                        <button type="button" class="chip-btn" data-sample="kasparov">Kasparov</button>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label for="analysisDepth" class="small text-muted mb-0">Depth:</label>
                    <select id="analysisDepth" class="form-select form-select-sm py-0 px-2" style="width:auto; height:28px; background:#0d0f13; color:#f3f4f6; border-color:var(--border-subtle); font-size:0.78rem;">
                        <option value="10">Fast (10)</option>
                        <option value="12" selected>Standard (12)</option>
                        <option value="14">Deep (14)</option>
                        <option value="16">Master (16)</option>
                    </select>
                    <button type="button" id="btnCloseDrawer" class="btn-tool" style="min-height:28px;min-width:28px;" title="Close Drawer"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
            <textarea class="form-control pgn-textarea mb-2" id="pgnInput" rows="3" placeholder="Paste standard PGN notation here..."></textarea>
            <div class="d-flex align-items-center gap-2">
                <button id="analyzeBtn" class="btn btn-primary btn-sm px-3 fw-semibold" style="background:var(--accent); border:none; color:#000; height:32px;">
                    <i class="bi bi-play-circle-fill me-1"></i> Analyze Game
                </button>
                <button id="cancelAnalyzeBtn" class="btn btn-outline-danger btn-sm d-none" style="height:32px;">
                    <i class="bi bi-x-circle me-1"></i> Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Main Studio Space -->
    <main class="studio-container">
        <!-- Inline Progress Strip -->
        <div id="analysisProgressContainer" class="progress-strip">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <span id="progressText" class="small fw-medium text-info">Initializing Stockfish WASM...</span>
                <span id="progressPercent" class="badge bg-info text-dark font-monospace">0%</span>
            </div>
            <div class="progress" style="height: 5px; background: #0d0f13;">
                <div id="progressBar" class="progress-bar bg-info" role="progressbar" style="width: 0%"></div>
            </div>
        </div>

        <div class="studio-grid">
            <!-- Left Column: Board -->
            <div class="board-column">
                <div class="game-info-strip" id="gameInfo">
                    <span class="game-info-players">White vs Black</span>
                    <span class="text-muted small">Ready</span>
                </div>

                <div class="board-wrapper">
                    <div class="board-container">
                        <div id="board"></div>
                        <svg id="arrow-svg"></svg>
                    </div>
                </div>

                <!-- Docked Board Toolbar -->
                <div class="board-toolbar">
                    <div class="nav-cluster">
                        <button id="btnFirst" class="btn-tool" title="First Move (Home)"><i class="bi bi-skip-start-fill"></i></button>
                        <button id="btnPrev" class="btn-tool" title="Previous Move (←)"><i class="bi bi-chevron-left"></i></button>
                        <button id="btnNext" class="btn-tool" title="Next Move (→)"><i class="bi bi-chevron-right"></i></button>
                        <button id="btnLast" class="btn-tool" title="Last Move (End)"><i class="bi bi-skip-end-fill"></i></button>
                    </div>
                    <button id="btnFlip" class="btn-tool" title="Flip Board (F)"><i class="bi bi-arrow-left-right me-1"></i> Flip</button>
                    <label class="threat-pill mb-0" title="Toggle Threat Radar">
                        <input type="checkbox" id="toggleThreats" checked>
                        <span><i class="bi bi-bullseye"></i> Threats</span>
                    </label>
                </div>
            </div>

            <!-- Right Column: Studio Panel -->
            <div class="studio-panel">
                <!-- Move Diagnosis Banner -->
                <div class="diagnosis-card" id="moveExplanation">
                    <div class="diagnosis-empty">
                        <i class="bi bi-cursor-fill opacity-50"></i>
                        <span>Select a move to inspect engine analysis, threats, and variations</span>
                    </div>
                </div>

                <!-- Move Notation Sheet -->
                <div class="sheet-card">
                    <div class="sheet-header">
                        <span class="sheet-title">Moves</span>
                        <span id="moveCountSummary" class="text-muted small">0 moves</span>
                    </div>
                    <div class="analysis-container" id="analysisContainer">
                        <div class="text-center text-muted py-4 small">
                            <p class="mb-2">Load a game or select a sample above to begin analysis.</p>
                            <button type="button" class="chip-btn px-3 py-1" onclick="document.getElementById('btnTogglePgn').click()">
                                <i class="bi bi-file-earmark-plus me-1"></i> Open PGN Input
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="js/chess.min.js"></script>
    <script src="js/chessboard-1.0.0.js"></script>
    <script src="js/chess-evaluator.js"></script>
    <script src="js/opening-detector.js"></script>
    <script src="js/situation-recognizer.js"></script>
    <script src="js/browser-analyzer.js"></script>
    <script>
        $(document).ready(function() {
            const board = Chessboard('board', {
                position: 'start',
                pieceTheme: 'img/chesspieces/wikipedia/{piece}.png'
            });
            const chess = new Chess();
            let analysisData = null;
            let currentMoveIndex = -1;
            let moves = [];
            let moveHistory = [];
            let isPlayingVariation = false;
            let animationSpeed = 1000;
            let animationTimeout = null;
            let browserDoctor = null;

            const SAMPLE_GAMES = {
                opera: `[Event "Paris"]\n[Site "Paris FRA"]\n[Date "1858.??.??"]\n[White "Paul Morphy"]\n[Black "Duke Karl / Count Isouard"]\n[Result "1-0"]\n\n1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8# 1-0`,
                scholar: `[Event "Casual Game"]\n[Site "Chess Doctor"]\n[Date "2024.??.??"]\n[White "Scholar's Attacker"]\n[Black "Defender"]\n[Result "1-0"]\n\n1. e4 e5 2. Qh5 Nc6 3. Bc4 Nf6 4. Qxf7# 1-0`,
                kasparov: `[Event "Hoogovens"]\n[Site "Wijk aan Zee NED"]\n[Date "1999.01.20"]\n[White "Garry Kasparov"]\n[Black "Veselin Topalov"]\n[Result "1-0"]\n\n1. e4 d6 2. d4 Nf6 3. Nc3 g6 4. Be3 Bg7 5. Qd2 c6 6. f3 b5 7. Nge2 Nbd7 8. Bh6 Bxh6 9. Qxh6 Bb7 10. a3 e5 11. O-O-O Qe7 12. Kb1 a6 13. Nc1 O-O-O 14. Nb3 exd4 15. Rxd4 c5 16. Rd1 Nb6 17. g3 Kb8 18. Na5 Ba8 19. Bh3 d5 20. Qf4+ Ka7 21. Rhe1 d4 22. Nd5 Nbxd5 23. exd5 Qd6 24. Rxd4 cxd4 25. Re7+ Kb6 26. Qxd4+ Kxa5 27. b4+ Ka4 28. Qc3 Qxd5 29. Ra7 Bb7 30. Rxb7 Qc4 31. Qxf6 Kxa3 32. Qxa6+ Kxb4 33. c3+ Kxc3 34. Qa1+ Kd2 35. Qb2+ Kd1 36. Bf1 Rd2 37. Rd7 Rxd7 38. Bxc4 bxc4 39. Qxh8 Rd3 40. Qa8 c3 41. Qa4+ Ke1 42. f4 f5 43. Kc1 Rd2 44. Qa7 1-0`
            };

            // DOM elements
            const pgnInput = document.getElementById('pgnInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const cancelAnalyzeBtn = document.getElementById('cancelAnalyzeBtn');
            const analysisContainer = document.getElementById('analysisContainer');
            const moveExplanation = document.getElementById('moveExplanation');
            const gameInfo = document.getElementById('gameInfo');
            const btnFirst = document.getElementById('btnFirst');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnLast = document.getElementById('btnLast');
            const btnFlip = document.getElementById('btnFlip');
            const arrowSvg = document.getElementById('arrow-svg');
            const boardContainer = document.querySelector('.board-container');
            const toggleThreats = document.getElementById('toggleThreats');
            const pgnDrawer = document.getElementById('pgnDrawer');
            const btnTogglePgn = document.getElementById('btnTogglePgn');
            const btnCloseDrawer = document.getElementById('btnCloseDrawer');
            const pgnCaret = document.getElementById('pgnCaret');

            // Drawer Toggle
            function toggleDrawer(open) {
                if (open === undefined) {
                    open = !pgnDrawer.classList.contains('open');
                }
                if (open) {
                    pgnDrawer.classList.add('open');
                    btnTogglePgn.classList.add('active');
                    if (pgnCaret) pgnCaret.className = 'bi bi-chevron-up';
                } else {
                    pgnDrawer.classList.remove('open');
                    btnTogglePgn.classList.remove('active');
                    if (pgnCaret) pgnCaret.className = 'bi bi-chevron-down';
                }
            }

            btnTogglePgn.addEventListener('click', () => toggleDrawer());
            if (btnCloseDrawer) btnCloseDrawer.addEventListener('click', () => toggleDrawer(false));

            // Ensure SVG dimensions match board exactly
            function updateSvgDimensions() {
                const boardEl = document.getElementById('board');
                if (boardEl && arrowSvg) {
                    const boardRect = boardEl.getBoundingClientRect();
                    arrowSvg.setAttribute('width', boardRect.width);
                    arrowSvg.setAttribute('height', boardRect.width);
                }
            }
            setTimeout(updateSvgDimensions, 100);

            setupArrowMarkers();

            analyzeBtn.addEventListener('click', analyzeGame);
            if (cancelAnalyzeBtn) {
                cancelAnalyzeBtn.addEventListener('click', function() {
                    if (browserDoctor) browserDoctor.cancel();
                });
            }

            btnFirst.addEventListener('click', goToFirstMove);
            btnPrev.addEventListener('click', goToPrevMove);
            btnNext.addEventListener('click', goToNextMove);
            btnLast.addEventListener('click', goToLastMove);
            
            function flipBoard() {
                board.flip();
                updateSvgDimensions();
                if (currentMoveIndex >= 0) drawMoveArrows(currentMoveIndex);
            }
            if (btnFlip) btnFlip.addEventListener('click', flipBoard);

            if (toggleThreats) {
                toggleThreats.addEventListener('change', function() {
                    if (currentMoveIndex >= 0) drawMoveArrows(currentMoveIndex);
                });
            }

            // Sample games click handlers
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const sampleKey = this.dataset.sample;
                    if (SAMPLE_GAMES[sampleKey]) {
                        pgnInput.value = SAMPLE_GAMES[sampleKey];
                        toggleDrawer(true);
                        if (sampleKey === 'kasparov') {
                            const depthEl = document.getElementById('analysisDepth');
                            if (depthEl) depthEl.value = '10';
                        }
                    }
                });
            });

            // Keyboard navigation listener (←, →, Home, End, F, Space)
            document.addEventListener('keydown', function(e) {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') return;

                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToPrevMove();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goToNextMove();
                } else if (e.key === 'Home') {
                    e.preventDefault();
                    goToFirstMove();
                } else if (e.key === 'End') {
                    e.preventDefault();
                    goToLastMove();
                } else if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    flipBoard();
                } else if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    if (isPlayingVariation) {
                        returnToGamePosition();
                    } else {
                        goToNextMove();
                    }
                }
            });

            function setupArrowMarkers() {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const createMarker = (id, className) => {
                    const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                    marker.setAttribute('id', id);
                    marker.setAttribute('markerWidth', '6');
                    marker.setAttribute('markerHeight', '4');
                    marker.setAttribute('refX', '4');
                    marker.setAttribute('refY', '2');
                    marker.setAttribute('orient', 'auto');
                    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    polygon.setAttribute('points', '0 0, 6 2, 0 4');
                    polygon.setAttribute('class', className);
                    marker.appendChild(polygon);
                    return marker;
                };
                defs.appendChild(createMarker('arrowhead-current', 'arrow-head-current'));
                defs.appendChild(createMarker('arrowhead-better', 'arrow-head-better'));
                defs.appendChild(createMarker('arrowhead-threat', 'arrow-head-threat'));
                defs.appendChild(createMarker('arrowhead-opponent-threat', 'arrow-head-opponent-threat'));
                arrowSvg.appendChild(defs);
            }

            function handleAnalysisResult(data) {
                if (!data) return;
                analysisData = data;
                displayGameInfo(data.game_info || {});
                moves = data.moves || [];
                
                if (moves.length === 0) {
                    analysisContainer.innerHTML = '<div class="alert alert-warning m-2 py-2 small">No moves analyzed. Please check PGN format.</div>';
                    return;
                }

                preprocessMoves();
                displayAnalysis(moves);
                goToFirstMove();
                toggleDrawer(false); // Collapse drawer on completion to maximize board space
            }

            async function analyzeGame() {
                const pgn = pgnInput.value.trim();
                if (!pgn) {
                    alert('Please paste a PGN or choose a sample game.');
                    return;
                }
                
                const analysisDepth = parseInt(document.getElementById('analysisDepth')?.value || '12', 10);

                chess.reset();
                board.position('start');
                clearArrows();
                clearSquareAnnotations();
                analysisContainer.innerHTML = '<div class="text-center text-muted py-4 small">Analyzing game moves with Stockfish WASM...</div>';
                moveExplanation.innerHTML = `
                    <div class="d-flex align-items-center gap-2 py-2 text-info small">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        <span>Stockfish WASM analyzing moves at depth ${analysisDepth}...</span>
                    </div>`;
                currentMoveIndex = -1;
                moveHistory = [];

                const progressContainer = document.getElementById('analysisProgressContainer');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                const progressPercent = document.getElementById('progressPercent');
                const cancelBtn = document.getElementById('cancelAnalyzeBtn');

                if (progressContainer) progressContainer.classList.add('show');
                if (cancelBtn) cancelBtn.classList.remove('d-none');
                analyzeBtn.disabled = true;
                if (progressBar) progressBar.style.width = '0%';
                if (progressPercent) progressPercent.textContent = '0%';
                if (progressText) progressText.textContent = `Initializing Stockfish WASM (Depth ${analysisDepth})...`;

                toggleDrawer(false); // Automatically collapse drawer

                if (!browserDoctor) {
                    browserDoctor = new BrowserChessDoctor();
                }

                const onProgress = (prog) => {
                    if (progressBar) progressBar.style.width = `${prog.percentage}%`;
                    if (progressPercent) progressPercent.textContent = `${prog.percentage}%`;
                    if (progressText) {
                        progressText.textContent = `Analyzing ${prog.ply} of ${prog.totalPlies} (${prog.move}) • Depth ${prog.depth || analysisDepth}`;
                    }
                };

                try {
                    const data = await browserDoctor.analyzeGame(pgn, onProgress, analysisDepth);
                    if (data.errors && data.errors.length > 0 && (!data.moves || data.moves.length === 0)) {
                        throw new Error(data.errors.join(', '));
                    }
                    handleAnalysisResult(data);
                } catch (error) {
                    analysisContainer.innerHTML = `<div class="alert alert-danger m-2 py-2 small">${error.message}</div>`;
                    console.error('Browser analysis error:', error);
                } finally {
                    if (progressContainer) progressContainer.classList.remove('show');
                    if (cancelBtn) cancelBtn.classList.add('d-none');
                    analyzeBtn.disabled = false;
                }
            }

            function preprocessMoves() {
                chess.reset();
                moveHistory = [];
                
                moves.forEach((move, index) => {
                    try {
                        const currentFen = chess.fen();
                        const chessMove = chess.move(move.move);
                        
                        if (chessMove) {
                            moveHistory.push({
                                from: chessMove.from,
                                to: chessMove.to,
                                fen: currentFen
                            });
                            
                            if (move.quality !== 'good move' && move.analysis && move.analysis.best_move) {
                                const tempChess = new Chess(currentFen);
                                try {
                                    let betterMove = null;
                                    try {
                                        betterMove = tempChess.move(move.analysis.best_move);
                                    } catch (e) {
                                        if (move.analysis.best_move.length >= 4) {
                                            try {
                                                betterMove = tempChess.move({
                                                    from: move.analysis.best_move.substring(0, 2),
                                                    to: move.analysis.best_move.substring(2, 4),
                                                    promotion: move.analysis.best_move.length > 4 ? move.analysis.best_move[4] : undefined
                                                });
                                            } catch (e2) {}
                                        }
                                    }
                                    
                                    if (!betterMove && move.analysis.principal_variation) {
                                        const pvMoves = parsePrincipalVariation(move.analysis.principal_variation, currentFen);
                                        if (pvMoves.length > 0) {
                                            betterMove = {
                                                from: pvMoves[0].from,
                                                to: pvMoves[0].to,
                                                san: pvMoves[0].san,
                                                promotion: pvMoves[0].promotion
                                            };
                                        }
                                    }
                                    
                                    if (betterMove) {
                                        moves[index].betterMoveData = {
                                            from: betterMove.from,
                                            to: betterMove.to,
                                            san: betterMove.san,
                                            promotion: betterMove.promotion
                                        };
                                    }
                                } catch (e) {
                                    console.error('Error parsing better move:', move.analysis.best_move, e);
                                }
                            }
                        }
                    } catch (e) {
                        console.error('Error preprocessing move:', move.move, e);
                    }
                });
                chess.reset();
            }

            function displayGameInfo(info) {
                if (!info) return;
                const whitePlayer = info.white || 'White';
                const blackPlayer = info.black || 'Black';
                const event = info.event || '';
                const date = info.date || '';
                const result = info.result || '';
                
                gameInfo.innerHTML = `
                    <span class="game-info-players">${whitePlayer} vs ${blackPlayer}</span>
                    <span class="text-muted small">${result ? result + ' • ' : ''}${event || date || 'Analyzed'}</span>
                `;
            }

            function displayAnalysis(moves) {
                if (!moves || moves.length === 0) {
                    analysisContainer.innerHTML = '<div class="text-center text-muted py-4 small">No moves to display.</div>';
                    return;
                }
                
                const movesByNumber = {};
                moves.forEach(move => {
                    if (!movesByNumber[move.move_number]) {
                        movesByNumber[move.move_number] = { white: null, black: null };
                    }
                    if (move.is_white) {
                        movesByNumber[move.move_number].white = move;
                    } else {
                        movesByNumber[move.move_number].black = move;
                    }
                });
                
                let html = '<div class="move-sheet-rows">';
                
                Object.keys(movesByNumber).sort((a, b) => parseInt(a) - parseInt(b)).forEach(moveNumber => {
                    const movePair = movesByNumber[moveNumber];
                    html += `<div class="move-pair">`;
                    html += `<div class="move-number">${moveNumber}.</div>`;
                    
                    // White
                    if (movePair.white) {
                        const whiteIndex = moves.findIndex(m => m.move_number === parseInt(moveNumber) && m.is_white);
                        const whiteQuality = getQualityClass(movePair.white.detailed_quality || movePair.white.quality);
                        const dotClass = whiteQuality === 'good-move' ? 'good' : whiteQuality;
                        html += `<div class="white-move" data-index="${whiteIndex}" id="move-${whiteIndex}">`;
                        html += `<span class="dot-q dot-${dotClass}"></span>`;
                        html += `<span>${movePair.white.move}</span>`;
                        html += `</div>`;
                    } else {
                        html += `<div></div>`;
                    }
                    
                    // Black
                    if (movePair.black) {
                        const blackIndex = moves.findIndex(m => m.move_number === parseInt(moveNumber) && !m.is_white);
                        const blackQuality = getQualityClass(movePair.black.detailed_quality || movePair.black.quality);
                        const dotClass = blackQuality === 'good-move' ? 'good' : blackQuality;
                        html += `<div class="black-move" data-index="${blackIndex}" id="move-${blackIndex}">`;
                        html += `<span class="dot-q dot-${dotClass}"></span>`;
                        html += `<span>${movePair.black.move}</span>`;
                        html += `</div>`;
                    } else {
                        html += `<div></div>`;
                    }
                    
                    html += `</div>`;
                });
                
                html += '</div>';
                analysisContainer.innerHTML = html;
                
                const moveCountSummary = document.getElementById('moveCountSummary');
                if (moveCountSummary) moveCountSummary.textContent = `${moves.length} moves`;

                document.querySelectorAll('.white-move, .black-move').forEach(item => {
                    if (item.dataset.index) {
                        item.addEventListener('click', function() {
                            const index = parseInt(this.dataset.index);
                            goToMove(index);
                        });
                    }
                });
            }

            function showMoveExplanation(index) {
                if (index < 0 || index >= moves.length) {
                    moveExplanation.innerHTML = `
                        <div class="diagnosis-empty">
                            <i class="bi bi-cursor-fill opacity-50"></i>
                            <span>Select a move to inspect engine analysis, threats, and variations</span>
                        </div>`;
                    return;
                }
                
                const move = moves[index];
                let html = '';
                
                const playerName = move.player || (move.is_white ? 'White' : 'Black');
                const qualityTitle = (move.detailed_quality || move.quality || 'move').toUpperCase();
                const qualityClass = getQualityClass(move.detailed_quality || move.quality);
                
                let evalText = (move.evaluation !== undefined && move.evaluation !== null) ? `${move.evaluation}` : '';
                if (evalText && !evalText.startsWith('+') && !evalText.startsWith('-') && !evalText.startsWith('#')) {
                    evalText = '+' + evalText;
                }

                html += `
                    <div class="diagnosis-header">
                        <div class="move-title-wrap">
                            <span class="player-badge ${move.is_white ? 'white' : 'black'}">${playerName}</span>
                            <span class="move-san">${move.move}</span>
                            <span class="badge-q ${qualityClass}">${qualityTitle}</span>
                        </div>
                        ${evalText ? `<span class="eval-tag">${evalText}</span>` : ''}
                    </div>`;
                
                if (move.tags && move.tags.length > 0) {
                    html += `<div class="tags-cluster">`;
                    move.tags.forEach(tag => {
                        html += `<span class="diag-tag">${tag}</span>`;
                    });
                    html += `</div>`;
                }

                if (move.analysis) {
                    if (move.analysis.threats_created && move.analysis.threats_created.length > 0) {
                        const threatNames = move.analysis.threats_created.map(t => t.description || t).join(', ');
                        html += `
                            <div class="threat-alert-box">
                                <i class="bi bi-bullseye"></i>
                                <span>Threat:</span>
                                <strong>${threatNames}</strong>
                            </div>`;
                    }

                    if (move.analysis.refutation) {
                        html += `
                            <div class="threat-alert-box">
                                <i class="bi bi-exclamation-triangle"></i>
                                <span>Opponent threat:</span>
                                <strong>${move.analysis.refutation}</strong>
                            </div>`;
                    }

                    if (move.analysis.explanation) {
                        html += `<div class="diagnosis-text">${move.analysis.explanation}</div>`;
                    }

                    html += `<div class="var-row">`;

                    // Punishment line
                    if (move.quality !== 'good move' && move.analysis.refutation_variation) {
                        html += `
                            <div class="var-pill var-refutation clickable" data-index="${index}" data-type="refutation">
                                <div class="text-truncate"><span class="text-danger fw-semibold me-1"><i class="bi bi-shield-slash"></i> Punishment:</span>${move.analysis.refutation_variation}</div>
                                <button class="btn-var-play play-refutation-button" data-index="${index}">Play</button>
                            </div>`;
                    }

                    // Recommended line
                    if (move.analysis.principal_variation) {
                        html += `
                            <div class="var-pill var-better clickable" data-index="${index}" data-type="better">
                                <div class="text-truncate"><span class="text-success fw-semibold me-1"><i class="bi bi-check2"></i> Recommended:</span>${move.analysis.principal_variation}</div>
                                <button class="btn-var-play play-button" data-index="${index}">Play</button>
                            </div>`;
                    }

                    html += `</div>`;
                } else {
                    html += '<div class="diagnosis-text text-muted mb-0">This move is considered solid.</div>';
                }
                
                moveExplanation.innerHTML = html;
                
                moveExplanation.querySelectorAll('.var-pill.clickable').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('button')) return;
                        const idx = parseInt(this.dataset.index);
                        const type = this.dataset.type || 'better';
                        playVariation(idx, type);
                    });
                });
                
                const playBtn = moveExplanation.querySelector('.play-button');
                if (playBtn) {
                    playBtn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        playVariation(idx, 'better');
                    });
                }

                const playRefutationBtn = moveExplanation.querySelector('.play-refutation-button');
                if (playRefutationBtn) {
                    playRefutationBtn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        playVariation(idx, 'refutation');
                    });
                }
            }

            function drawMoveArrows(index) {
                clearArrows();
                clearSquareAnnotations();
                updateSvgDimensions();
                
                if (index < 0 || index >= moves.length) return;
                
                const move = moves[index];
                const showThreats = toggleThreats ? toggleThreats.checked : true;
                
                if (moveHistory[index]) {
                    const moveData = moveHistory[index];
                    drawArrow(moveData.from, moveData.to, 'current');
                    
                    if (move.quality === 'blunder' || move.quality === 'mistake' || move.quality === 'inaccuracy') {
                        addSquareAnnotation(moveData.to, move.quality);
                    }
                    
                    if (move.quality !== 'good move' && move.betterMoveData) {
                        drawArrow(move.betterMoveData.from, move.betterMoveData.to, 'better');
                    }

                    if (showThreats && move.analysis && move.analysis.threats_created && move.analysis.threats_created.length > 0) {
                        const threat = move.analysis.threats_created[0];
                        drawArrow(threat.from, threat.to, 'threat');
                    }

                    if (showThreats && move.quality !== 'good move' && move.analysis && move.analysis.refutation_from && move.analysis.refutation_to) {
                        drawArrow(move.analysis.refutation_from, move.analysis.refutation_to, 'opponent-threat');
                    }
                }
            }

            function drawArrow(from, to, type) {
                const boardEl = document.getElementById('board');
                if (!boardEl) return;
                const boardRect = boardEl.getBoundingClientRect();
                const squareSize = boardRect.width / 8;
                
                const isFlipped = board.orientation() === 'black';
                const fromFile = isFlipped ? 7 - (from.charCodeAt(0) - 97) : (from.charCodeAt(0) - 97);
                const fromRank = isFlipped ? parseInt(from.charAt(1)) - 1 : 8 - parseInt(from.charAt(1));
                const toFile = isFlipped ? 7 - (to.charCodeAt(0) - 97) : (to.charCodeAt(0) - 97);
                const toRank = isFlipped ? parseInt(to.charAt(1)) - 1 : 8 - parseInt(to.charAt(1));
                
                const fromX = (fromFile + 0.5) * squareSize;
                const fromY = (fromRank + 0.5) * squareSize;
                const toX = (toFile + 0.5) * squareSize;
                const toY = (toRank + 0.5) * squareSize;
                
                const angle = Math.atan2(toY - fromY, toX - fromX);
                const shortenBy = squareSize * 0.25;
                const adjustedToX = toX - shortenBy * Math.cos(angle);
                const adjustedToY = toY - shortenBy * Math.sin(angle);
                
                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                arrow.setAttribute('x1', fromX);
                arrow.setAttribute('y1', fromY);
                arrow.setAttribute('x2', adjustedToX);
                arrow.setAttribute('y2', adjustedToY);
                arrow.setAttribute('class', `arrow-${type}`);
                arrow.setAttribute('marker-end', `url(#arrowhead-${type})`);
                
                arrowSvg.appendChild(arrow);
            }

            function clearArrows() {
                const defs = arrowSvg.querySelector('defs');
                arrowSvg.innerHTML = '';
                if (defs) {
                    arrowSvg.appendChild(defs);
                } else {
                    setupArrowMarkers();
                }
            }

            function addSquareAnnotation(square, moveQuality) {
                clearSquareAnnotations();
                if (!square || !moveQuality || moveQuality === 'good move') return;
                
                const isFlipped = board.orientation() === 'black';
                const file = isFlipped ? 7 - (square.charCodeAt(0) - 97) : (square.charCodeAt(0) - 97);
                const rank = isFlipped ? parseInt(square.charAt(1)) - 1 : 8 - parseInt(square.charAt(1));
                
                let symbol = '';
                switch(moveQuality) {
                    case 'blunder': symbol = '??'; break;
                    case 'mistake': symbol = '?'; break;
                    case 'inaccuracy': symbol = '?!'; break;
                }
                
                const annotation = document.createElement('div');
                annotation.className = `square-annotation annotation-${moveQuality.replace(' ', '-')}`;
                annotation.style.left = `${file * 12.5}%`;
                annotation.style.top = `${rank * 12.5}%`;
                annotation.setAttribute('data-symbol', symbol);
                
                boardContainer.appendChild(annotation);
            }

            function clearSquareAnnotations() {
                const annotations = document.querySelectorAll('.square-annotation');
                annotations.forEach(annotation => annotation.remove());
            }

            function getQualityClass(quality) {
                switch (quality) {
                    case 'blunder': return 'blunder';
                    case 'mistake': return 'mistake';
                    case 'inaccuracy': return 'inaccuracy';
                    case 'good move': 
                    case 'good': return 'good-move';
                    case 'best': return 'good-move';
                    case 'excellent': return 'good-move';
                    case 'brilliant': return 'brilliant';
                    case 'great': return 'great';
                    case 'book': return 'book';
                    default: return '';
                }
            }

            function goToFirstMove() {
                stopVariationPlayback();
                chess.reset();
                board.position('start');
                currentMoveIndex = -1;
                updateMoveHighlight();
                clearArrows();
                clearSquareAnnotations();
                moveExplanation.innerHTML = `
                    <div class="diagnosis-empty">
                        <i class="bi bi-cursor-fill opacity-50"></i>
                        <span>Select a move to inspect engine analysis, threats, and variations</span>
                    </div>`;
            }

            function goToPrevMove() {
                stopVariationPlayback();
                if (currentMoveIndex > 0) {
                    goToMove(currentMoveIndex - 1);
                } else if (currentMoveIndex === 0) {
                    goToFirstMove();
                }
            }

            function goToNextMove() {
                stopVariationPlayback();
                if (currentMoveIndex < moves.length - 1) {
                    goToMove(currentMoveIndex + 1);
                }
            }

            function goToLastMove() {
                stopVariationPlayback();
                if (moves.length > 0) {
                    goToMove(moves.length - 1);
                }
            }

            function goToMove(index) {
                if (index < 0 || index >= moves.length) return;
                
                stopVariationPlayback();
                chess.reset();
                
                for (let i = 0; i <= index; i++) {
                    const move = moves[i];
                    try {
                        chess.move(move.move);
                    } catch (e) {
                        console.error('Invalid move:', move.move, e);
                    }
                }
                
                board.position(chess.fen());
                currentMoveIndex = index;
                
                updateMoveHighlight();
                showMoveExplanation(index);
                
                setTimeout(() => {
                    drawMoveArrows(index);
                }, 80);
                
                const currentMove = document.getElementById(`move-${index}`);
                if (currentMove) {
                    currentMove.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            function updateMoveHighlight() {
                document.querySelectorAll('.white-move, .black-move').forEach(item => {
                    item.classList.remove('active');
                });
                if (currentMoveIndex >= 0) {
                    const currentMove = document.getElementById(`move-${currentMoveIndex}`);
                    if (currentMove) currentMove.classList.add('active');
                }
            }

            window.addEventListener('resize', function() {
                if (board && board.resize) board.resize();
                updateSvgDimensions();
                if (currentMoveIndex >= 0) {
                    drawMoveArrows(currentMoveIndex);
                }
            });

            function parsePrincipalVariation(pvString, startingFen) {
                if (!pvString) return [];
                const tempChess = new Chess(startingFen);
                let cleanPV = pvString.replace(/\s+/g, ' ').trim();
                const tokens = cleanPV.split(' ');
                const movesList = [];
                const potentialMoves = [];

                for (let i = 0; i < tokens.length; i++) {
                    let token = tokens[i];
                    if (token.includes('...')) {
                        const parts = token.split('...');
                        if (parts.length > 1 && parts[1]) potentialMoves.push(parts[1].trim());
                    } else if (token.includes('.')) {
                        const parts = token.split('.');
                        if (parts.length > 1 && parts[1]) potentialMoves.push(parts[1].trim());
                    } else {
                        potentialMoves.push(token);
                    }
                }

                for (let i = 0; i < potentialMoves.length; i++) {
                    const moveText = potentialMoves[i];
                    let move = null;
                    try {
                        move = tempChess.move(moveText);
                    } catch (e) {}
                    
                    if (!move && moveText.length >= 4) {
                        try {
                            move = tempChess.move({
                                from: moveText.substring(0, 2),
                                to: moveText.substring(2, 4),
                                promotion: moveText.length > 4 ? moveText[4] : undefined
                            });
                        } catch (e) {}
                    }
                    
                    if (move) {
                        movesList.push({
                            from: move.from,
                            to: move.to,
                            promotion: move.promotion,
                            san: move.san,
                            fen: tempChess.fen()
                        });
                    }
                }
                return movesList;
            }

            function findKingSquare(chessInstance, color) {
                for (const f of ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h']) {
                    for (let r = 1; r <= 8; r++) {
                        const sq = f + r;
                        const p = chessInstance.get(sq);
                        if (p && p.type === 'k' && p.color === color) return sq;
                    }
                }
                return null;
            }

            function getMoveThreats(boardAfter, moveData) {
                let threats = [];
                if (typeof SituationRecognizer !== 'undefined' && boardAfter && moveData) {
                    threats = SituationRecognizer.detectThreatsCreated(boardAfter, moveData) || [];

                    if (boardAfter.in_check && boardAfter.in_check()) {
                        if (!threats.some(t => t.is_check)) {
                            const oppKingSq = findKingSquare(boardAfter, boardAfter.turn());
                            if (oppKingSq) {
                                const moverColor = (boardAfter.turn() === 'w') ? 'b' : 'w';
                                const checkers = SituationRecognizer.getAttackers(boardAfter, moverColor, oppKingSq);
                                checkers.forEach(sq => {
                                    threats.push({
                                        from: sq,
                                        to: oppKingSq,
                                        target: 'king',
                                        is_check: true,
                                        is_undefended: true,
                                        description: 'checks enemy King'
                                    });
                                });
                            }
                        }
                    }
                }
                return threats;
            }

            function playVariation(moveIndex, lineType = 'better') {
                stopVariationPlayback();
                const move = moves[moveIndex];
                if (!move || !move.analysis) return;
                
                const isRefutation = (lineType === 'refutation');
                
                let startingFen = 'start';
                if (isRefutation) {
                    if (moveIndex + 1 < moveHistory.length && moveHistory[moveIndex + 1]) {
                        startingFen = moveHistory[moveIndex + 1].fen;
                    } else {
                        const tempChess = new Chess();
                        for (let i = 0; i <= moveIndex; i++) {
                            try { tempChess.move(moves[i].move); } catch (e) {}
                        }
                        startingFen = tempChess.fen();
                    }
                } else {
                    if (moveIndex < moveHistory.length && moveHistory[moveIndex]) {
                        startingFen = moveHistory[moveIndex].fen;
                    } else if (moveIndex > 0) {
                        const tempChess = new Chess();
                        for (let i = 0; i < moveIndex; i++) {
                            try { tempChess.move(moves[i].move); } catch (e) {}
                        }
                        startingFen = tempChess.fen();
                    }
                }
                
                const rawVariation = isRefutation ? move.analysis.refutation_variation : move.analysis.principal_variation;
                const arrowStyle = isRefutation ? 'opponent-threat' : 'better';

                if (!rawVariation) {
                    if (isRefutation) {
                        if (!move.analysis.refutation_from || !move.analysis.refutation_to) {
                            alert('No punishment line available.');
                            return;
                        }
                    } else {
                        if (move.analysis.best_move && move.betterMoveData) {
                            showBetterMoveOnly(moveIndex, move.betterMoveData);
                        } else {
                            alert('No alternative moves available.');
                        }
                        return;
                    }
                }
                
                let variationMoves = rawVariation ? parsePrincipalVariation(rawVariation, startingFen) : [];
                if (variationMoves.length === 0 && isRefutation && move.analysis.refutation_from && move.analysis.refutation_to) {
                    variationMoves = [{
                        from: move.analysis.refutation_from,
                        to: move.analysis.refutation_to,
                        san: move.analysis.refutation || ''
                    }];
                }

                if (variationMoves.length === 0) {
                    if (!isRefutation && move.analysis.best_move && move.betterMoveData) {
                        showBetterMoveOnly(moveIndex, move.betterMoveData);
                        return;
                    }
                    alert('Unable to parse variation moves.');
                    return;
                }
                
                isPlayingVariation = true;
                chess.load(startingFen);
                board.position(startingFen);
                
                // Active variation banner inside diagnosis card
                moveExplanation.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="badge ${isRefutation ? 'bg-danger' : 'bg-success'} text-white fw-bold">
                            ${isRefutation ? 'PUNISHMENT LINE' : 'RECOMMENDED LINE'}
                        </span>
                        <button id="stopVariationBtn" class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size:0.78rem;">
                            <i class="bi bi-arrow-return-left me-1"></i> Return
                        </button>
                    </div>
                    <div id="moveIndicator" class="text-light small fw-medium mb-1">
                        Move 0 of ${variationMoves.length}
                    </div>
                    <div id="variationThreatBanner" class="small text-danger"></div>
                `;

                document.getElementById('stopVariationBtn').addEventListener('click', returnToGamePosition);

                let currentVarMoveIndex = 0;
                clearArrows();
                clearSquareAnnotations();
                if (variationMoves.length > 0) {
                    drawArrow(variationMoves[0].from, variationMoves[0].to, arrowStyle);
                }
                
                function playNextMove() {
                    if (!isPlayingVariation) return;
                    if (currentVarMoveIndex < variationMoves.length) {
                        const moveData = variationMoves[currentVarMoveIndex];
                        let executedMove = null;
                        try {
                            executedMove = chess.move({
                                from: moveData.from,
                                to: moveData.to,
                                promotion: moveData.promotion || 'q'
                            });
                            board.position(chess.fen(), true);
                            clearArrows();
                            clearSquareAnnotations();

                            const moveThreats = getMoveThreats(chess, moveData);
                            const showThreats = toggleThreats ? toggleThreats.checked : true;
                            if (showThreats && moveThreats.length > 0) {
                                moveThreats.slice(0, 3).forEach(threat => {
                                    drawArrow(threat.from, threat.to, 'threat');
                                });
                            }

                            if (currentVarMoveIndex + 1 < variationMoves.length) {
                                const nextMove = variationMoves[currentVarMoveIndex + 1];
                                drawArrow(nextMove.from, nextMove.to, arrowStyle);
                            }

                            const indicator = document.getElementById('moveIndicator');
                            if (indicator) {
                                const moveNotation = executedMove ? executedMove.san : (moveData.san || '');
                                indicator.innerHTML = `Move ${currentVarMoveIndex + 1} of ${variationMoves.length}: <strong class="text-info">${moveNotation}</strong>`;
                            }

                            const tb = document.getElementById('variationThreatBanner');
                            if (tb) {
                                let threatHtml = '';
                                if (chess.in_checkmate && chess.in_checkmate()) {
                                    threatHtml = '<span class="badge bg-danger">Checkmate delivered!</span>';
                                } else if (chess.in_check && chess.in_check()) {
                                    threatHtml = '<span class="text-danger"><i class="bi bi-exclamation-triangle"></i> Check! King under attack.</span>';
                                } else if (moveThreats.length > 0) {
                                    threatHtml = `<span>Threat: <strong>${moveThreats.map(t => t.description).join(', ')}</strong></span>`;
                                }
                                tb.innerHTML = threatHtml;
                            }
                            
                            currentVarMoveIndex++;
                            if (currentVarMoveIndex < variationMoves.length) {
                                animationTimeout = setTimeout(playNextMove, animationSpeed);
                            } else {
                                onVariationComplete(move, isRefutation);
                            }
                        } catch (e) {
                            console.error('Error playing variation:', e);
                            stopVariationPlayback();
                        }
                    }
                }
                
                setTimeout(() => {
                    if (isPlayingVariation) playNextMove();
                }, 650);
            }

            function showBetterMoveOnly(moveIndex, betterMoveData) {
                stopVariationPlayback();
                const move = moves[moveIndex];
                if (!move) return;
                
                let startingFen = 'start';
                if (moveIndex < moveHistory.length && moveHistory[moveIndex]) {
                    startingFen = moveHistory[moveIndex].fen;
                } else if (moveIndex > 0) {
                    const tempChess = new Chess();
                    for (let i = 0; i < moveIndex; i++) {
                        try { tempChess.move(moves[i].move); } catch (e) {}
                    }
                    startingFen = tempChess.fen();
                }
                
                isPlayingVariation = true;
                chess.load(startingFen);
                board.position(startingFen);
                
                moveExplanation.innerHTML = `
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="badge bg-success text-white fw-bold">BETTER MOVE</span>
                        <button id="stopVariationBtn" class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size:0.78rem;">
                            <i class="bi bi-arrow-return-left me-1"></i> Return
                        </button>
                    </div>
                    <div class="small text-light mb-1">Playing: <strong>${betterMoveData.san || move.analysis.best_move}</strong></div>
                    <div id="variationThreatBanner" class="small text-danger"></div>
                `;
                document.getElementById('stopVariationBtn').addEventListener('click', returnToGamePosition);

                clearArrows();
                clearSquareAnnotations();
                drawArrow(betterMoveData.from, betterMoveData.to, 'better');
                
                animationTimeout = setTimeout(() => {
                    if (!isPlayingVariation) return;
                    try {
                        chess.move({
                            from: betterMoveData.from,
                            to: betterMoveData.to,
                            promotion: betterMoveData.promotion || 'q'
                        });
                        board.position(chess.fen(), true);
                        clearArrows();
                        clearSquareAnnotations();

                        const moveThreats = getMoveThreats(chess, betterMoveData);
                        const showThreats = toggleThreats ? toggleThreats.checked : true;
                        if (showThreats && moveThreats.length > 0) {
                            moveThreats.slice(0, 3).forEach(threat => {
                                drawArrow(threat.from, threat.to, 'threat');
                            });
                        }
                        onVariationComplete(move, false);
                    } catch (e) {
                        console.error('Error executing better move:', e);
                    }
                }, 650);
            }

            function onVariationComplete(move, isRefutation) {
                isPlayingVariation = false;
                const stopBtn = document.getElementById('stopVariationBtn');
                if (stopBtn) {
                    stopBtn.className = 'btn btn-primary btn-sm py-1 px-3';
                    stopBtn.innerHTML = '<i class="bi bi-arrow-return-left me-1"></i> Return to Game';
                }
            }

            function stopVariationPlayback() {
                isPlayingVariation = false;
                if (animationTimeout) {
                    clearTimeout(animationTimeout);
                    animationTimeout = null;
                }
                clearArrows();
                clearSquareAnnotations();
            }

            function returnToGamePosition() {
                stopVariationPlayback();
                if (currentMoveIndex >= 0) {
                    goToMove(currentMoveIndex);
                } else {
                    goToFirstMove();
                }
            }
        });
    </script>
</body>
</html>
